<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B17"/>
      <stop offset="1" stop-color="#0A1030"/>
    </linearGradient>
    <linearGradient id="neon" x1="220" y1="60" x2="1380" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="500" rx="24" fill="url(#bg)"/>
  <circle cx="1350" cy="100" r="220" fill="#8B5CF6" opacity="0.10"/>
  <circle cx="240" cy="420" r="200" fill="#3B82F6" opacity="0.12"/>

  <path d="M90 390C260 280 420 460 610 330C800 200 980 410 1180 280C1320 190 1410 215 1510 170" stroke="url(#neon)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <g opacity="0.9">
    <text x="120" y="210" fill="#E5E7EB" font-family="'Segoe UI', 'Inter', sans-serif" font-size="64" font-weight="700">Pratyush Nishank</text>
    <text x="122" y="265" fill="#93C5FD" font-family="'Segoe UI', 'Inter', sans-serif" font-size="30" font-weight="500">Futuristic Android Developer</text>
    <text x="122" y="315" fill="#C4B5FD" font-family="'Segoe UI', 'Inter', sans-serif" font-size="24" font-weight="400">Kotlin • Jetpack Compose • AI/ML Enthusiast</text>
  </g>

  <rect x="118" y="340" width="340" height="52" rx="26" fill="#0F172A" stroke="#60A5FA"/>
  <text x="160" y="373" fill="#BFDBFE" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="600">Building premium apps</text>
</svg>
